<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/images/parrot.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href='https://fonts.googleapis.com/css?family=Big Shoulders Display' rel='stylesheet'>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./public/src/styles.css"/>
    <title>PollyGlot</title>
  </head>
  <body>
    <header>
      <div class="header-container">
        <img class="parrot-image" src="./public/images/parrot.png">
        <div class="text-title">
            <h1>PollyGlot</h1>
            <h3>Perfect Traslation Every Time</h3>
        </div>
      </div>
      <main class="main-container">
        <form>
          <fieldset>
            <label for="to-translate" class="blue">Text to traslate 👇</label>
            <textarea id="to-translate" placeholder="How are you?"></textarea>
            <h2  class="blue">Select language 👇</h2>
            <div class="radio-container">
              <div class="input-el">
              <input type="radio" id="french" name="radio-languag" value="French">
              <label for="french">French</label>
              <img src="./public/images/fr-flag.png">
              </div>
              <br/>
              <div class="input-el">
              <input type="radio" id="spanish" name="radio-languag" value="Spanish">
              <label for="spanish">Spanish</label>
              <img src="./public/images/sp-flag.png">
              </div>
              <br/>
              <div class="input-el">
              <input type="radio" id="japanese" name="radio-languag" value="japanese">
              <label for="japanese">Japanese</label>
              <img src="./public/images/jpn-flag.png">
              </div>
              </div>
            <button type="submit" class="form-btn" id="form-btn">Traslate</button>
            </fieldset>
        </form>
      </main>
    </header>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
